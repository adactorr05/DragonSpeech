# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.7.6
maven_group=com.dragonspeech

# Dependencies
fabric_api_version=0.116.13+1.21.1
# ModMenu - compile-time only (see build.gradle's modCompileOnly) so the mod
# still builds/runs fine for anyone without ModMenu installed. 11.0.3 is the
# newest release confirmed to support 1.21.1 as of this being written -
# check https://modrinth.com/mod/modmenu/versions for a newer one if this
# mod's own Minecraft version target is ever bumped past 1.21.1.
modmenu_version=11.0.3